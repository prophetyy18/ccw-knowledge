[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccw-knowledge"
version = "1.0.0"
description = "Knowledge Layer for AI Coding Agents. Markdown-first, Obsidian-compatible, plugin-friendly."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ccw-knowledge authors" }]
keywords = ["knowledge-base", "ai-agent", "obsidian", "claude-code", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = []

[project.scripts]
ccw-knowledge = "ccw_knowledge.cli:main"

[project.urls]
Homepage = "https://github.com/prophetyy18/ccw-knowledge"
Repository = "https://github.com/prophetyy18/ccw-knowledge"

[tool.setuptools.packages.find]
where = ["."]
include = ["ccw_knowledge*"]

[tool.setuptools.package-data]
ccw_knowledge = ["py.typed"]
